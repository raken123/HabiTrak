<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#000000" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta name="mobile-web-app-capable" content="yes" />
<title>Miniphone — mini screen</title>
<style>
/* ============================================================
   Miniphone.
   The whole display is black except one rounded square in the
   top-left corner — the mini screen. Its geometry is taken from
   the reference photo: a 598x598 square at (20,23) on a 1170px
   wide display, i.e. 51.1% of the screen width, inset 1.7%/2.0%.
   Everything outside that square stays pure black.
   ============================================================ */

:root{
  --tint:#4f8cff;
  --ok:#32d74b;
  --warn:#ff453a;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
[hidden]{ display:none !important; }   /* beats the display:flex/grid rules below */

html,body{
  margin:0; height:100%; background:#000; overflow:hidden;
  font-family:var(--font); color:#fff;
  -webkit-user-select:none; user-select:none;
  overscroll-behavior:none;
}

/* The phone display itself. On a phone this is the whole viewport;
   on a desktop it becomes a 390-wide stand-in so the square keeps
   its real proportions while you preview. */
#phone{
  position:fixed; inset:0;
  background:#000;
  overflow:hidden;
}
.preview-note{ display:none; }
@media (min-width:620px){
  body{ display:grid; place-items:center; background:#08090b; }
  #phone{
    position:relative; inset:auto;
    width:390px; height:844px;
    border-radius:46px;
    box-shadow:0 0 0 1px #1c1f26, 0 30px 70px -30px #000;
  }
  .preview-note{
    display:block; position:fixed; bottom:18px; left:0; right:0;
    text-align:center; font-size:12px; color:#4a5160;
  }
}

/* ---------- the mini screen ---------- */
#frame{
  position:absolute;
  overflow:hidden;
  background:#000;
  /* left / top / width / height / border-radius are set from JS so the
     square always lands where the photo says it does */
}
#screen{
  position:absolute; top:0; left:0;
  width:200px; height:200px;          /* fixed design canvas, scaled to fit */
  transform-origin:0 0;
  overflow:hidden;
  font-size:10px; line-height:1.3;
}

/* wallpapers */
.wp-aurora{ background:linear-gradient(150deg,#08152e,#1b4472 48%,#0b2726 100%); }
.wp-sunset{ background:linear-gradient(150deg,#260e2c,#7a2b4e 50%,#cf6238 100%); }
.wp-mint{   background:linear-gradient(150deg,#04170f,#0f5d4a 52%,#63c795 110%); }
.wp-black{  background:#000; }
.wp-rose{   background:linear-gradient(150deg,#250d1c,#8c3a5a 55%,#dc9c9c 115%); }

/* The square is very round (35% corners), so every layer keeps its content
   inside the largest rectangle that clears the corner arcs. Backgrounds still
   run full-bleed to the clipped edge. */
.layer{
  position:absolute; inset:0; z-index:10;
  display:flex; flex-direction:column;
  padding:19px 21px 17px;
  transition:opacity .16s ease, transform .2s cubic-bezier(.2,.85,.25,1);
}
#viewCamera{ padding:0; }   /* the viewfinder is full-bleed; its overlays are padded */
.layer.enter{ opacity:0; transform:scale(.92); }

/* status bar */
.status{
  flex:0 0 auto;
  display:flex; align-items:center; justify-content:space-between;
  font-size:8.5px; font-weight:600;
  color:rgba(255,255,255,.9); letter-spacing:.2px;
}
.status .r{ display:flex; align-items:center; gap:3px; }
.bars{ display:flex; align-items:flex-end; gap:1.5px; height:7px; }
.bars i{ width:2px; border-radius:1px; background:currentColor; opacity:.4; }
.bars i:nth-child(1){height:2.5px;opacity:1}
.bars i:nth-child(2){height:4px;opacity:1}
.bars i:nth-child(3){height:5.5px}
.bars i:nth-child(4){height:7px}
.batt{ width:16px; height:8px; border-radius:2.5px; padding:1px; box-shadow:inset 0 0 0 1px rgba(255,255,255,.55); }
.batt span{ display:block; height:100%; border-radius:1px; background:#fff; }
.batt.low span{ background:var(--warn); }

/* ---------- home ---------- */
.clock{
  text-align:center; margin-top:8px;
  font-size:36px; font-weight:200; letter-spacing:-1.5px; line-height:1;
  font-variant-numeric:tabular-nums;
  text-shadow:0 2px 8px rgba(0,0,0,.35);
}
.date{ text-align:center; font-size:8.5px; opacity:.75; margin-top:3px; }
.note{
  margin:6px 2px 0; padding:4px 6px; border-radius:8px;
  background:rgba(255,255,255,.15);
  display:flex; align-items:center; gap:5px;
  font-size:8px; cursor:pointer;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);
}
.note .dot{ width:5px; height:5px; border-radius:50%; background:var(--tint); flex:0 0 auto; }
.note .txt{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

.apps{
  margin-top:auto; padding-bottom:2px;
  display:grid; grid-template-columns:repeat(3,1fr); gap:4px;
}
.app{
  background:none; border:0; padding:0; cursor:pointer; color:#fff; font-family:var(--font);
  display:flex; flex-direction:column; align-items:center; gap:3px; position:relative;
}
.app .ic{
  width:40px; height:40px; border-radius:11px; display:grid; place-items:center;
  box-shadow:0 3px 8px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.14);
  transition:transform .12s ease;
}
.app:active .ic{ transform:scale(.9); }
.app .nm{ font-size:7.5px; font-weight:500; opacity:.95; text-shadow:0 1px 2px rgba(0,0,0,.5); }
.app .bdg{
  position:absolute; top:-3px; right:8px;
  min-width:13px; height:13px; padding:0 3px; border-radius:7px;
  background:var(--warn); font-size:7.5px; font-weight:700;
  display:grid; place-items:center; box-shadow:0 1px 3px rgba(0,0,0,.5);
}
.ic-cam{ background:linear-gradient(155deg,#5b6474,#1d212a); }
.ic-msg{ background:linear-gradient(155deg,#38b6ff,#0a6fe8); }
.ic-set{ background:linear-gradient(155deg,#9aa3b2,#474d5a); }

/* ---------- shared app chrome ---------- */
.app-view{ background:#07090d; }
.bar{
  flex:0 0 auto; display:flex; align-items:center; gap:4px;
  padding:0 0 5px; font-size:9px; font-weight:600;
  border-bottom:1px solid rgba(255,255,255,.09);
}
.bar .title{ flex:1; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ib{
  border:0; cursor:pointer; font-family:var(--font); flex:0 0 auto;
  background:rgba(255,255,255,.12); color:#fff;
  width:20px; height:20px; border-radius:7px;
  display:grid; place-items:center; font-size:10px; line-height:1; padding:0;
}
.ib:active{ transform:scale(.9); }
.ib.w{ width:auto; padding:0 7px; font-size:8px; font-weight:600; }
.body{ flex:1; overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; }
.body::-webkit-scrollbar{ width:0; height:0; }

/* ---------- camera ---------- */
.cam{ position:relative; flex:1; background:#000; overflow:hidden; }
.cam video{ width:100%; height:100%; object-fit:cover; display:block; background:#000; }
.cam video.mirror{ transform:scaleX(-1); }
.cam .grid{
  position:absolute; inset:0; pointer-events:none; opacity:.45;
  background-image:
    linear-gradient(to right, rgba(255,255,255,.35) .5px, transparent .5px),
    linear-gradient(to bottom, rgba(255,255,255,.35) .5px, transparent .5px);
  background-size:33.33% 33.33%;
}
.cam .top{
  position:absolute; top:0; left:0; right:0; z-index:3;
  display:flex; align-items:center; gap:4px; padding:16px 22px 10px;
  background:linear-gradient(to bottom, rgba(0,0,0,.6), transparent);
}
.cam .top .title{ flex:1; text-align:center; font-size:8.5px; font-weight:600; }
.cam .ctl{
  position:absolute; bottom:0; left:0; right:0; z-index:3;
  display:flex; align-items:center; justify-content:space-between; padding:10px 24px 16px;
  background:linear-gradient(to top, rgba(0,0,0,.65), transparent);
}
.shutter{
  width:36px; height:36px; border-radius:50%; border:0; padding:0; cursor:pointer;
  background:#fff; box-shadow:0 0 0 2px rgba(0,0,0,.5), 0 0 0 4px rgba(255,255,255,.9);
}
.shutter:active{ transform:scale(.9); }
.thumb{
  width:24px; height:24px; border-radius:7px; border:0; padding:0; cursor:pointer;
  background:rgba(255,255,255,.14) center/cover no-repeat;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);
  font-size:10px; color:rgba(255,255,255,.7);
}
.chip{
  position:absolute; z-index:3; top:34px; right:22px;
  background:rgba(0,0,0,.5); padding:1.5px 5px; border-radius:999px;
  font-size:7px; letter-spacing:.3px;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);
}
.camoff{
  position:absolute; inset:0; z-index:2; display:grid; place-items:center; text-align:center;
  padding:44px 26px; font-size:8px; line-height:1.5; color:rgba(255,255,255,.85);
  background:repeating-linear-gradient(135deg,#0c0f15 0 8px,#090b10 8px 16px);
}
.camoff b{ display:block; font-size:9.5px; margin-bottom:4px; }
.flashfx{ position:absolute; inset:0; z-index:4; background:#fff; opacity:0; pointer-events:none; transition:opacity .3s ease; }
.flashfx.fire{ opacity:.92; transition:none; }

.gallery{ padding:5px 0 0; display:grid; grid-template-columns:repeat(3,1fr); gap:4px; }
.gallery img{ width:100%; aspect-ratio:1; object-fit:cover; border-radius:5px; display:block; cursor:pointer; }
.gallery .empty{ grid-column:1/-1; text-align:center; padding:34px 8px; font-size:8.5px; opacity:.55; line-height:1.6; }
.viewer{ padding:6px 0 0; display:flex; flex-direction:column; gap:5px; align-items:center; }
.viewer img{ width:100%; border-radius:8px; }
.viewer .row{ display:flex; gap:4px; }

/* ---------- messenger ---------- */
.chat{
  width:100%; border:0; background:none; cursor:pointer; font-family:var(--font); color:#fff;
  display:flex; gap:6px; align-items:center; padding:5px 2px; text-align:left; border-radius:6px;
}
.chat:active{ background:rgba(255,255,255,.07); }
.av{
  width:24px; height:24px; border-radius:50%; flex:0 0 auto;
  display:grid; place-items:center; font-size:9px; font-weight:700;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);
}
.meta{ flex:1; min-width:0; }
.meta .n{ display:flex; justify-content:space-between; gap:4px; font-size:9px; font-weight:600; }
.meta .n span{ font-size:7.5px; font-weight:500; opacity:.5; flex:0 0 auto; }
.meta .p{ font-size:8px; opacity:.55; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.meta .p.unread{ opacity:1; font-weight:600; }
.cnt{
  min-width:13px; height:13px; padding:0 4px; border-radius:7px; background:var(--tint);
  font-size:7.5px; font-weight:700; display:grid; place-items:center; flex:0 0 auto;
}
.thread{ padding:5px 0 2px; display:flex; flex-direction:column; gap:3px; }
.bub{
  max-width:84%; padding:4px 6px; border-radius:10px;
  font-size:8.5px; line-height:1.35; word-break:break-word; animation:pop .16s ease;
}
@keyframes pop{ from{ opacity:0; transform:translateY(4px) scale(.97);} }
.bub.them{ align-self:flex-start; background:#212734; border-bottom-left-radius:3px; }
.bub.me{ align-self:flex-end; background:linear-gradient(160deg,#3a8dff,#1667e0); border-bottom-right-radius:3px; }
.bub .t{ display:block; font-size:6.5px; opacity:.55; margin-top:2px; text-align:right; }
.typing{ align-self:flex-start; background:#212734; padding:5px 7px; border-radius:10px; border-bottom-left-radius:3px; display:flex; gap:2.5px; }
.typing i{ width:3.5px; height:3.5px; border-radius:50%; background:rgba(255,255,255,.75); animation:blink 1.1s infinite; }
.typing i:nth-child(2){ animation-delay:.18s; } .typing i:nth-child(3){ animation-delay:.36s; }
@keyframes blink{ 0%,60%,100%{opacity:.25;transform:translateY(0)} 30%{opacity:1;transform:translateY(-1.5px)} }
.quick{ flex:0 0 auto; display:flex; gap:3px; padding:0 0 4px; overflow-x:auto; }
.quick::-webkit-scrollbar{ height:0; }
.quick button{
  flex:0 0 auto; border:0; cursor:pointer; font-family:var(--font);
  background:rgba(255,255,255,.12); color:#fff; padding:3px 6px; border-radius:999px; font-size:7.5px;
}
.composer{
  flex:0 0 auto; display:flex; gap:4px; align-items:center; padding:5px 0 0;
  border-top:1px solid rgba(255,255,255,.09);
}
.composer input{
  flex:1; min-width:0; border:0; outline:0; font-family:var(--font);
  background:rgba(255,255,255,.12); color:#fff;
  padding:4px 7px; border-radius:999px; font-size:8.5px;
  -webkit-user-select:text; user-select:text;
}
.composer input::placeholder{ color:rgba(255,255,255,.45); }
.send{
  width:20px; height:20px; border-radius:50%; border:0; cursor:pointer; flex:0 0 auto;
  background:var(--tint); color:#fff; font-size:10px; display:grid; place-items:center; padding:0;
}
.send:disabled{ opacity:.35; }

/* ---------- settings ---------- */
.grp{ margin:5px 0 0; border-radius:8px; overflow:hidden; background:#141821; }
.grp-t{ font-size:7px; font-weight:700; letter-spacing:.8px; text-transform:uppercase; opacity:.45; margin:7px 3px 3px; }
.row{
  display:flex; align-items:center; gap:6px; padding:5px 7px; font-size:8.5px;
  border-top:1px solid rgba(255,255,255,.06);
}
.grp .row:first-child{ border-top:0; }
.row .lbl{ flex:1; }
.row .sub{ display:block; font-size:6.5px; opacity:.5; margin-top:1px; line-height:1.3; }
.row .val{ opacity:.55; font-size:8px; }
.row.tap{ cursor:pointer; }
.row.tap:active{ background:rgba(255,255,255,.06); }
.sw{
  width:28px; height:16px; border-radius:999px; border:0; padding:1.5px; cursor:pointer; flex:0 0 auto;
  background:rgba(255,255,255,.2); transition:background .18s ease;
}
.sw b{ display:block; width:13px; height:13px; border-radius:50%; background:#fff; transition:transform .18s cubic-bezier(.3,1.4,.5,1); }
.sw.on{ background:var(--ok); }
.sw.on b{ transform:translateX(12px); }
.row input[type=range]{ flex:1; min-width:0; height:12px; accent-color:var(--tint); }
.row input[type=text]{
  flex:1; min-width:0; border:0; outline:0; font-family:var(--font);
  background:rgba(255,255,255,.1); color:#fff; padding:3px 6px; border-radius:5px; font-size:8px;
  -webkit-user-select:text; user-select:text;
}
.wps{ display:flex; gap:5px; padding:6px 7px; flex-wrap:wrap; }
.wps button{ width:24px; height:24px; border-radius:7px; border:0; cursor:pointer; box-shadow:inset 0 0 0 1px rgba(255,255,255,.2); }
.wps button.sel{ box-shadow:0 0 0 1.5px var(--tint), inset 0 0 0 1px rgba(255,255,255,.2); }
.danger{ color:var(--warn); font-weight:600; }
.hero{ text-align:center; padding:9px 8px 3px; }
.hero .m{ font-size:11px; font-weight:600; }
.hero .s{ font-size:7.5px; opacity:.5; margin-top:2px; }
.foot{ text-align:center; font-size:6.5px; opacity:.35; padding:8px 8px 10px; line-height:1.5; }

/* toast */
.toast{
  position:absolute; z-index:70; left:24px; right:24px; bottom:16px;
  background:rgba(16,19,25,.95); padding:4px 7px; border-radius:7px;
  font-size:8px; text-align:center; box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);
  opacity:0; transform:translateY(5px); transition:opacity .18s ease, transform .18s ease;
  pointer-events:none;
}
.toast.show{ opacity:1; transform:translateY(0); }

@media (prefers-reduced-motion:reduce){ *{ animation-duration:.01ms !important; transition:none !important; } }
</style>
</head>
<body>

<div id="phone">
  <div id="frame">
    <div id="screen" class="wp-aurora">

      <!-- ---------------- HOME ---------------- -->
      <div class="layer" id="viewHome">
        <div class="status">
          <span id="stTime">9:41</span>
          <span class="r">
            <span class="bars"><i></i><i></i><i></i><i></i></span>
            <span class="batt" id="stBatt"><span style="width:80%"></span></span>
          </span>
        </div>

        <div class="clock" id="clock">9:41</div>
        <div class="date" id="date">Fri 24</div>
        <div class="note" id="note" hidden><span class="dot"></span><span class="txt" id="noteTxt"></span></div>

        <div class="apps">
          <button class="app" data-open="camera">
            <span class="ic ic-cam">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.7l1-1.6A1 1 0 0 1 9 4h6a1 1 0 0 1 .8.4l1 1.6h1.7A2.5 2.5 0 0 1 21 8.5v8A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5z"/>
                <circle cx="12" cy="12.5" r="3.4"/>
              </svg>
            </span>
            <span class="nm">Camera</span>
          </button>

          <button class="app" data-open="messenger">
            <span class="ic ic-msg">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="#fff">
                <path d="M12 3C6.9 3 3 6.7 3 11.2c0 2.5 1.2 4.7 3.2 6.2V21l3-1.6c.9.2 1.8.4 2.8.4 5.1 0 9-3.7 9-8.6S17.1 3 12 3zm.9 11-2.4-2.5L6.1 14l4.9-5.2 2.4 2.5L17.8 9z"/>
              </svg>
            </span>
            <span class="nm">Messenger</span>
            <span class="bdg" id="badge" hidden>0</span>
          </button>

          <button class="app" data-open="settings">
            <span class="ic ic-set">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3.2"/>
                <path d="M19.4 14.5a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.2a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.2a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.2a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.2a1.6 1.6 0 0 0-1.4 1z"/>
              </svg>
            </span>
            <span class="nm">Settings</span>
          </button>
        </div>
      </div>

      <!-- ---------------- CAMERA ---------------- -->
      <div class="layer app-view" id="viewCamera" hidden>
        <div class="cam" id="camStage">
          <video id="video" playsinline autoplay muted></video>
          <div class="grid" id="camGrid" hidden></div>

          <div class="top">
            <button class="ib" data-home title="Home">‹</button>
            <span class="title" id="camTitle">Back camera</span>
            <button class="ib" id="camSwap" title="Switch lens">⇄</button>
          </div>
          <span class="chip" id="camChip">REAR</span>

          <div class="camoff" id="camOff" hidden>
            <div>
              <b id="camOffTitle">Camera off</b>
              <span id="camOffText">Tap start and allow camera access to use the rear lens.</span>
              <div style="margin-top:7px"><button class="ib w" id="camStart">Start camera</button></div>
            </div>
          </div>

          <div class="flashfx" id="flashfx"></div>

          <div class="ctl">
            <button class="thumb" id="camThumb" title="Shots">▦</button>
            <button class="shutter" id="shutter" title="Take photo"></button>
            <button class="ib" id="camTorch" title="Flash">⚡</button>
          </div>
        </div>
      </div>

      <!-- ---------------- SHOTS ---------------- -->
      <div class="layer app-view" id="viewGallery" hidden>
        <div class="bar">
          <button class="ib" data-back="camera">‹</button>
          <span class="title">Shots</span>
          <button class="ib w" id="galClear">Clear</button>
        </div>
        <div class="body"><div class="gallery" id="galGrid"></div></div>
      </div>

      <!-- ---------------- PHOTO ---------------- -->
      <div class="layer app-view" id="viewPhoto" hidden>
        <div class="bar">
          <button class="ib" data-back="gallery">‹</button>
          <span class="title" id="photoTitle">Photo</span>
          <button class="ib" id="photoDelete" title="Delete">🗑</button>
        </div>
        <div class="body">
          <div class="viewer">
            <img id="photoImg" alt="Captured photo" />
            <div class="row" style="border:0;padding:0">
              <button class="ib w" id="photoSave">Save</button>
              <button class="ib w" id="photoSend">Send</button>
            </div>
          </div>
        </div>
      </div>

      <!-- ---------------- MESSENGER ---------------- -->
      <div class="layer app-view" id="viewMessenger" hidden>
        <div class="bar">
          <button class="ib" data-home>‹</button>
          <span class="title">Messenger</span>
          <button class="ib" id="readAll" title="Mark all read">✓</button>
        </div>
        <div class="body"><div id="chatList"></div></div>
      </div>

      <div class="layer app-view" id="viewThread" hidden>
        <div class="bar">
          <button class="ib" data-back="messenger">‹</button>
          <span class="title" id="threadName">Chat</span>
          <span class="av" id="threadAv" style="width:16px;height:16px;font-size:7px">?</span>
        </div>
        <div class="body" id="threadBody"><div class="thread" id="threadMsgs"></div></div>
        <div class="quick" id="quick"></div>
        <form class="composer" id="composer" autocomplete="off">
          <input id="msgInput" placeholder="Message" maxlength="240" />
          <button class="send" id="msgSend" type="submit" disabled>↑</button>
        </form>
      </div>

      <!-- ---------------- SETTINGS ---------------- -->
      <div class="layer app-view" id="viewSettings" hidden>
        <div class="bar">
          <button class="ib" data-home>‹</button>
          <span class="title">Miniphone Settings</span>
          <span style="width:20px"></span>
        </div>
        <div class="body" id="settingsBody"></div>
      </div>

      <div class="toast" id="toast"></div>
    </div>
  </div>
</div>

<p class="preview-note">Desktop preview — the mini screen sits where the black square is on the phone. Open on the phone for the real thing.</p>

<script>
(() => {
  "use strict";

  const $  = (s, r=document) => r.querySelector(s);
  const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));

  /* ============================================================
     Geometry — measured off the reference photo.
     598x598 square at (20,23) on a 1170px-wide display.
     All values are fractions of the display width, so the square
     keeps its place and shape on any screen size.
     ============================================================ */
  const GEOM_DEFAULT = { x: 20/1170, y: 23/1170, size: 598/1170, radius: 0.35 };
  const DESIGN = 200;                       // the mini UI is drawn on a 200x200 canvas

  const STORE_KEY = "miniphone.v2";
  const WALLPAPERS = [
    { id:"wp-aurora", name:"Aurora", css:"linear-gradient(150deg,#08152e,#1b4472 48%,#0b2726 100%)" },
    { id:"wp-sunset", name:"Sunset", css:"linear-gradient(150deg,#260e2c,#7a2b4e 50%,#cf6238 100%)" },
    { id:"wp-mint",   name:"Mint",   css:"linear-gradient(150deg,#04170f,#0f5d4a 52%,#63c795 110%)" },
    { id:"wp-rose",   name:"Rose",   css:"linear-gradient(150deg,#250d1c,#8c3a5a 55%,#dc9c9c 115%)" },
    { id:"wp-black",  name:"Black",  css:"#000" }
  ];

  const defaultState = () => ({
    settings: {
      deviceName:"Miniphone", use24h:true, wallpaper:"wp-aurora", brightness:100,
      gridLines:false, mirrorFront:true, shutterFlash:true,
      autoReply:true, haptics:true, keepAwake:true
    },
    geom: Object.assign({}, GEOM_DEFAULT),
    photos: [],
    chats: [
      { id:"c1", name:"Alva", color:"#ff6b6b", messages:[
        { from:"them", text:"is that a screen on the BACK of your phone", ts:Date.now()-1000*60*54 },
        { from:"me",   text:"flip the case and it wakes up 😎", ts:Date.now()-1000*60*52 },
        { from:"them", text:"send a photo with the rear lens", ts:Date.now()-1000*60*51 }
      ], unread:1 },
      { id:"c2", name:"Team", color:"#4f8cff", messages:[
        { from:"them", text:"standup moved to 10:15", ts:Date.now()-1000*60*60*4 }
      ], unread:1 },
      { id:"c3", name:"Mamma", color:"#ffb02e", messages:[
        { from:"them", text:"Ring mig när du kan ❤️", ts:Date.now()-1000*60*60*26 },
        { from:"me",   text:"Ringer ikväll!", ts:Date.now()-1000*60*60*25 }
      ], unread:0 }
    ]
  });

  let state = load();

  function load(){
    try{
      const raw = localStorage.getItem(STORE_KEY);
      if(!raw) return defaultState();
      const p = JSON.parse(raw), base = defaultState();
      return {
        settings: Object.assign(base.settings, p.settings || {}),
        geom:     Object.assign(base.geom, p.geom || {}),
        photos:   Array.isArray(p.photos) ? p.photos : [],
        chats:    Array.isArray(p.chats) && p.chats.length ? p.chats : base.chats
      };
    }catch(e){ return defaultState(); }
  }
  function save(){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
    catch(e){
      state.photos = state.photos.slice(0, 4);          // photos are the only heavy part
      try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(_){ toast("Storage full"); }
    }
  }

  /* ---------- place and scale the mini screen ---------- */
  const phone = $("#phone"), frame = $("#frame"), screen = $("#screen");

  function applyGeom(){
    const W = phone.clientWidth;
    const g = state.geom;
    const side = Math.round(g.size * W);
    frame.style.left   = Math.round(g.x * W) + "px";
    frame.style.top    = Math.round(g.y * W) + "px";
    frame.style.width  = side + "px";
    frame.style.height = side + "px";
    frame.style.borderRadius = Math.round(side * g.radius) + "px";
    screen.style.transform = "scale(" + (side / DESIGN) + ")";
  }
  window.addEventListener("resize", applyGeom);
  window.addEventListener("orientationchange", () => setTimeout(applyGeom, 120));

  function applyLook(){
    screen.className = state.settings.wallpaper;
    $$(".layer", screen).forEach(l => l.style.filter = `brightness(${Math.max(35, state.settings.brightness)}%)`);
    $("#camGrid").hidden = !state.settings.gridLines;
    applyGeom();
  }

  /* ============================================================
     Navigation
     ============================================================ */
  const VIEWS = {
    home:"#viewHome", camera:"#viewCamera", gallery:"#viewGallery",
    photo:"#viewPhoto", messenger:"#viewMessenger", thread:"#viewThread", settings:"#viewSettings"
  };
  let current = "home";

  function show(name){
    if(!VIEWS[name]) return;
    const prev = current;
    current = name;
    Object.entries(VIEWS).forEach(([k, sel]) => { $(sel).hidden = k !== name; });

    const el = $(VIEWS[name]);
    el.classList.add("enter");
    requestAnimationFrame(() => requestAnimationFrame(() => el.classList.remove("enter")));

    if(prev === "camera" && !["camera","gallery","photo"].includes(name)) stopCamera();
    if(name === "home")      renderHome();
    if(name === "messenger") renderChats();
    if(name === "gallery")   renderGallery();
    if(name === "settings")  renderSettings();
    if(name === "camera")    updateCam();
    buzz(6);
  }

  document.addEventListener("click", (e) => {
    const h = e.target.closest("[data-home]");   if(h){ show("home"); return; }
    const b = e.target.closest("[data-back]");   if(b){ show(b.dataset.back); return; }
    const o = e.target.closest("[data-open]");   if(o){ show(o.dataset.open); return; }
  });

  document.addEventListener("keydown", (e) => {
    if(e.key !== "Escape") return;
    if(current === "thread") show("messenger");
    else if(current === "photo") show("gallery");
    else if(current === "gallery") show("camera");
    else show("home");
  });

  /* ============================================================
     Clock / battery / helpers
     ============================================================ */
  function fmtTime(d = new Date()){
    const h24 = d.getHours(), m = String(d.getMinutes()).padStart(2,"0");
    if(state.settings.use24h) return `${String(h24).padStart(2,"0")}:${m}`;
    return `${h24 % 12 || 12}:${m}`;
  }
  function fmtStamp(ts){
    const d = new Date(ts), now = new Date();
    if(d.toDateString() === now.toDateString()) return fmtTime(d);
    if(Math.round((now - d) / 86400000) <= 1) return "Yest";
    return d.toLocaleDateString(undefined, { day:"numeric", month:"short" });
  }
  function buzz(ms){ if(state.settings.haptics && navigator.vibrate){ try{ navigator.vibrate(ms); }catch(e){} } }

  let toastTimer;
  function toast(text){
    const t = $("#toast");
    t.textContent = text; t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 1600);
  }

  let batteryLevel = 0.8, charging = false;
  if(navigator.getBattery){
    navigator.getBattery().then(b => {
      const sync = () => { batteryLevel = b.level; charging = b.charging; tick(); };
      b.addEventListener("levelchange", sync);
      b.addEventListener("chargingchange", sync);
      sync();
    }).catch(()=>{});
  }

  function tick(){
    const t = fmtTime();
    $("#stTime").textContent = t;
    $("#clock").textContent = t;
    $("#date").textContent = new Date().toLocaleDateString(undefined, { weekday:"short", day:"numeric", month:"short" });
    const pct = Math.round(batteryLevel * 100);
    const bar = $("#stBatt");
    bar.firstElementChild.style.width = Math.max(6, pct) + "%";
    bar.classList.toggle("low", pct <= 20 && !charging);
    bar.title = pct + "%" + (charging ? " charging" : "");
  }
  setInterval(tick, 1000);

  /* ============================================================
     Home
     ============================================================ */
  const unreadTotal = () => state.chats.reduce((n,c) => n + (c.unread||0), 0);

  function renderHome(){
    const n = unreadTotal();
    const badge = $("#badge");
    badge.hidden = n === 0;
    badge.textContent = n > 9 ? "9+" : n;

    const note = $("#note");
    if(n > 0){
      const chat = state.chats.find(c => c.unread > 0);
      const last = chat.messages[chat.messages.length - 1];
      note.hidden = false;
      $("#noteTxt").textContent = `${chat.name}: ${last ? last.text : "New message"}`;
      note.onclick = () => openThread(chat.id);
    }else{
      note.hidden = true; note.onclick = null;
    }
    tick();
  }

  /* ============================================================
     Back camera
     ============================================================ */
  const video = $("#video");
  let stream = null, facing = "environment", torchOn = false;

  function camOff(title, text, btn = true){
    $("#camOffTitle").textContent = title;
    $("#camOffText").textContent = text;
    $("#camStart").style.display = btn ? "" : "none";
    $("#camOff").hidden = false;
  }

  async function startCamera(){
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      camOff("No camera API", "This browser can't open a camera here. Serve the page over https:// and try again.", false);
      return;
    }
    stopCamera();
    const attempts = facing === "environment"
      ? [{ video:{ facingMode:{ exact:"environment" }, width:{ ideal:1280 } }, audio:false },
         { video:{ facingMode:"environment" }, audio:false },
         { video:true, audio:false }]
      : [{ video:{ facingMode:"user", width:{ ideal:1280 } }, audio:false },
         { video:true, audio:false }];

    let lastErr = null;
    for(const c of attempts){
      try{ stream = await navigator.mediaDevices.getUserMedia(c); break; }
      catch(err){ lastErr = err; }
    }
    if(!stream){
      const n = lastErr && lastErr.name;
      if(n === "NotAllowedError")       camOff("Access denied", "Allow camera permission for this page, then tap start again.");
      else if(n === "NotFoundError")    camOff("No camera", "This device reports no video input.");
      else if(n === "NotReadableError") camOff("Camera busy", "Another app is using the camera.");
      else                              camOff("Unavailable", (lastErr && lastErr.message) || "Could not open a video stream.");
      return;
    }
    $("#camOff").hidden = true;
    video.srcObject = stream;
    video.classList.toggle("mirror", facing === "user" && state.settings.mirrorFront);
    try{ await video.play(); }catch(e){}
    updateCam();
  }

  function stopCamera(){
    torchOn = false;
    if(stream){ stream.getTracks().forEach(t => t.stop()); stream = null; }
    video.srcObject = null;
  }

  function updateCam(){
    const rear = facing === "environment";
    $("#camTitle").textContent = rear ? "Back camera" : "Front camera";
    $("#camChip").textContent = rear ? "REAR" : "FRONT";
    $("#camGrid").hidden = !state.settings.gridLines;
    const last = state.photos[0], thumb = $("#camThumb");
    thumb.style.backgroundImage = last ? `url(${last.data})` : "none";
    thumb.textContent = last ? "" : "▦";
    if(!stream && $("#camOff").hidden) camOff("Camera off", "Tap start and allow camera access to use the rear lens.");
  }

  $("#camStart").addEventListener("click", startCamera);
  $("#camSwap").addEventListener("click", () => {
    facing = facing === "environment" ? "user" : "environment";
    updateCam(); startCamera();
  });

  $("#camTorch").addEventListener("click", async () => {
    if(!stream){ toast("Start the camera first"); return; }
    const track = stream.getVideoTracks()[0];
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    if(!caps.torch){ toast("No flash on this lens"); return; }
    torchOn = !torchOn;
    try{ await track.applyConstraints({ advanced:[{ torch: torchOn }] }); toast(torchOn ? "Flash on" : "Flash off"); }
    catch(e){ toast("Flash unavailable"); }
  });

  $("#shutter").addEventListener("click", capture);

  function capture(){
    if(!stream || !video.videoWidth){ toast("Camera is not running"); startCamera(); return; }
    if(state.settings.shutterFlash){
      const fx = $("#flashfx");
      fx.classList.add("fire");
      requestAnimationFrame(() => fx.classList.remove("fire"));
    }
    buzz(16);

    // The mini screen is square, so shots are square too. Kept small on purpose:
    // localStorage is the only place they live.
    const OUT = 512;
    const canvas = document.createElement("canvas");
    canvas.width = canvas.height = OUT;
    const ctx = canvas.getContext("2d");
    const vw = video.videoWidth, vh = video.videoHeight;
    const side = Math.min(vw, vh);
    const sx = (vw - side) / 2, sy = (vh - side) / 2;
    if(facing === "user" && state.settings.mirrorFront){ ctx.translate(OUT, 0); ctx.scale(-1, 1); }
    ctx.drawImage(video, sx, sy, side, side, 0, 0, OUT, OUT);

    state.photos.unshift({ id:"p"+Date.now(), data: canvas.toDataURL("image/jpeg", 0.72), ts:Date.now(), lens:facing });
    if(state.photos.length > 12) state.photos.length = 12;
    save(); updateCam(); toast("Saved to Shots");
  }

  $("#camThumb").addEventListener("click", () => show("gallery"));

  /* ---------- shots ---------- */
  function renderGallery(){
    const grid = $("#galGrid");
    grid.innerHTML = "";
    if(!state.photos.length){
      grid.innerHTML = '<div class="empty">No shots yet.<br>Open Camera and press the shutter.</div>';
      return;
    }
    state.photos.forEach(p => {
      const img = document.createElement("img");
      img.src = p.data;
      img.alt = "Photo from " + new Date(p.ts).toLocaleString();
      img.addEventListener("click", () => openPhoto(p.id));
      grid.appendChild(img);
    });
  }

  $("#galClear").addEventListener("click", () => {
    if(!state.photos.length || !confirm("Delete all shots?")) return;
    state.photos = []; save(); renderGallery(); updateCam(); toast("Shots cleared");
  });

  let openPhotoId = null;
  function openPhoto(id){
    const p = state.photos.find(x => x.id === id);
    if(!p) return;
    openPhotoId = id;
    $("#photoImg").src = p.data;
    $("#photoTitle").textContent = new Date(p.ts).toLocaleTimeString([], { hour:"2-digit", minute:"2-digit" });
    show("photo");
  }
  $("#photoDelete").addEventListener("click", () => {
    state.photos = state.photos.filter(p => p.id !== openPhotoId);
    save(); updateCam(); show("gallery"); toast("Deleted");
  });
  $("#photoSave").addEventListener("click", () => {
    const p = state.photos.find(x => x.id === openPhotoId);
    if(!p) return;
    const a = document.createElement("a");
    a.href = p.data;
    a.download = "miniphone-" + new Date(p.ts).toISOString().replace(/[:.]/g,"-") + ".jpg";
    a.click();
  });
  $("#photoSend").addEventListener("click", () => {
    const p = state.photos.find(x => x.id === openPhotoId);
    if(!p) return;
    const chat = state.chats[0];
    chat.messages.push({ from:"me", text:"📷 Photo from the mini screen", ts:Date.now() });
    save(); openThread(chat.id); toast("Sent to " + chat.name); autoReply(chat.id);
  });

  /* ============================================================
     Messenger
     ============================================================ */
  const REPLIES = ["haha okay 😄","on it","send a photo!","that mini screen is wild","yes please",
                   "give me 5 min","sounds good 👌","what?? show me","nice one","ok ok ok","🔥🔥"];
  const QUICKS = ["👍","On my way","haha","Later!","📷"];

  const lastTs = c => c.messages.length ? c.messages[c.messages.length-1].ts : 0;
  const initials = n => n.trim().split(/\s+/).slice(0,2).map(w => w[0]).join("").toUpperCase();
  const esc = s => String(s).replace(/[&<>"']/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]));

  function renderChats(){
    const list = $("#chatList");
    list.innerHTML = "";
    state.chats.slice().sort((a,b) => lastTs(b) - lastTs(a)).forEach(c => {
      const last = c.messages[c.messages.length-1];
      const row = document.createElement("button");
      row.className = "chat";
      row.innerHTML = `
        <span class="av" style="background:${c.color}">${esc(initials(c.name))}</span>
        <span class="meta">
          <span class="n">${esc(c.name)}<span>${last ? fmtStamp(last.ts) : ""}</span></span>
          <span class="p ${c.unread ? "unread" : ""}">${last ? (last.from === "me" ? "You: " : "") + esc(last.text) : "No messages"}</span>
        </span>
        ${c.unread ? `<span class="cnt">${c.unread}</span>` : ""}`;
      row.addEventListener("click", () => openThread(c.id));
      list.appendChild(row);
    });
  }

  let activeChat = null;
  function openThread(id){
    const chat = state.chats.find(c => c.id === id);
    if(!chat) return;
    activeChat = id; chat.unread = 0; save();
    $("#threadName").textContent = chat.name;
    const av = $("#threadAv");
    av.textContent = initials(chat.name);
    av.style.background = chat.color;
    renderThread(); renderQuicks(); show("thread");
  }

  function renderThread(){
    const chat = state.chats.find(c => c.id === activeChat);
    if(!chat) return;
    const box = $("#threadMsgs");
    box.innerHTML = "";
    chat.messages.forEach(m => {
      const b = document.createElement("div");
      b.className = "bub " + (m.from === "me" ? "me" : "them");
      b.innerHTML = esc(m.text) + `<span class="t">${fmtStamp(m.ts)}</span>`;
      box.appendChild(b);
    });
    scrollThread();
  }
  function scrollThread(){
    const body = $("#threadBody");
    requestAnimationFrame(() => { body.scrollTop = body.scrollHeight; });
  }
  function renderQuicks(){
    const wrap = $("#quick");
    wrap.innerHTML = "";
    QUICKS.forEach(q => {
      const b = document.createElement("button");
      b.type = "button"; b.textContent = q;
      b.addEventListener("click", () => sendMessage(q));
      wrap.appendChild(b);
    });
  }

  const input = $("#msgInput");
  input.addEventListener("input", () => { $("#msgSend").disabled = !input.value.trim(); });
  $("#composer").addEventListener("submit", (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if(text) sendMessage(text);
  });

  function sendMessage(text){
    const chat = state.chats.find(c => c.id === activeChat);
    if(!chat) return;
    chat.messages.push({ from:"me", text, ts:Date.now() });
    save();
    input.value = ""; $("#msgSend").disabled = true;
    renderThread(); buzz(8); autoReply(chat.id);
  }

  const replyTimers = new Map();
  function autoReply(chatId){
    if(!state.settings.autoReply || replyTimers.has(chatId)) return;

    const typingTimer = setTimeout(() => {
      if(current === "thread" && activeChat === chatId && !$(".typing", $("#threadMsgs"))){
        const t = document.createElement("div");
        t.className = "typing"; t.innerHTML = "<i></i><i></i><i></i>";
        $("#threadMsgs").appendChild(t); scrollThread();
      }
    }, 450);

    replyTimers.set(chatId, setTimeout(() => {
      clearTimeout(typingTimer);
      replyTimers.delete(chatId);
      const chat = state.chats.find(c => c.id === chatId);
      if(!chat) return;
      chat.messages.push({ from:"them", text: REPLIES[Math.floor(Math.random()*REPLIES.length)], ts:Date.now() });
      if(!(current === "thread" && activeChat === chatId)) chat.unread = (chat.unread||0) + 1;
      save();
      if(current === "thread" && activeChat === chatId){ renderThread(); buzz(12); }
      else if(current === "messenger") renderChats();
      else if(current === "home") renderHome();
    }, 1300 + Math.random()*1500));
  }

  $("#readAll").addEventListener("click", () => {
    state.chats.forEach(c => c.unread = 0);
    save(); renderChats(); toast("All marked read");
  });

  /* ============================================================
     Miniphone Settings
     ============================================================ */
  function renderSettings(){
    const s = state.settings, body = $("#settingsBody");
    body.innerHTML = "";

    const group = (title) => {
      if(title){ const h = document.createElement("div"); h.className = "grp-t"; h.textContent = title; body.appendChild(h); }
      const g = document.createElement("div"); g.className = "grp"; body.appendChild(g); return g;
    };
    const row = (g, label, sub) => {
      const r = document.createElement("div"); r.className = "row";
      const l = document.createElement("span"); l.className = "lbl";
      l.innerHTML = esc(label) + (sub ? `<span class="sub">${esc(sub)}</span>` : "");
      r.appendChild(l); g.appendChild(r); return r;
    };
    const toggle = (g, label, key, sub, after) => {
      const r = row(g, label, sub);
      const b = document.createElement("button");
      b.className = "sw" + (s[key] ? " on" : ""); b.innerHTML = "<b></b>";
      b.setAttribute("role","switch"); b.setAttribute("aria-checked", String(!!s[key]));
      b.addEventListener("click", () => {
        s[key] = !s[key];
        b.classList.toggle("on", s[key]);
        b.setAttribute("aria-checked", String(s[key]));
        save(); applyLook(); buzz(6); if(after) after();
      });
      r.appendChild(b);
    };
    const slider = (g, label, get, set, min, max, step, sub) => {
      const r = row(g, label, sub);
      const i = document.createElement("input");
      i.type = "range"; i.min = min; i.max = max; i.step = step || 1; i.value = get();
      i.addEventListener("input", () => { set(Number(i.value)); });
      i.addEventListener("change", save);
      r.appendChild(i);
      return i;
    };

    /* screen fit — the square must land exactly on the black cut-out,
       and browser chrome shifts the viewport, so it is adjustable. */
    const gFit = group("Screen fit");
    const fitNote = row(gFit, "Position the square", "Nudge until it fills the black area exactly");
    fitNote.querySelector(".lbl").style.opacity = ".75";
    slider(gFit, "Left",   () => state.geom.x*1000,      v => { state.geom.x = v/1000; applyGeom(); }, 0, 300, 1);
    slider(gFit, "Top",    () => state.geom.y*1000,      v => { state.geom.y = v/1000; applyGeom(); }, 0, 400, 1);
    slider(gFit, "Size",   () => state.geom.size*1000,   v => { state.geom.size = v/1000; applyGeom(); }, 200, 950, 1);
    slider(gFit, "Corner", () => state.geom.radius*100,  v => { state.geom.radius = v/100; applyGeom(); }, 0, 50, 1);
    const standalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
    const rMode = row(gFit, "Display mode",
      standalone ? "Fullscreen — the square lands exactly as measured"
                 : "In browser — Add to Home Screen for an exact fit");
    const modeVal = document.createElement("span");
    modeVal.className = "val"; modeVal.textContent = standalone ? "Standalone" : "Browser";
    rMode.appendChild(modeVal);

    const rFit = row(gFit, "Reset to photo measurements");
    rFit.classList.add("tap");
    rFit.addEventListener("click", () => {
      state.geom = Object.assign({}, GEOM_DEFAULT);
      save(); applyGeom(); renderSettings(); toast("Fit reset");
    });

    /* device */
    const gDev = group("Device");
    const rName = row(gDev, "Name");
    const nameInput = document.createElement("input");
    nameInput.type = "text"; nameInput.value = s.deviceName; nameInput.maxLength = 20;
    nameInput.addEventListener("change", () => {
      s.deviceName = nameInput.value.trim() || "Miniphone";
      save(); toast("Renamed");
    });
    rName.appendChild(nameInput);
    toggle(gDev, "24-hour clock", "use24h", null, tick);
    toggle(gDev, "Keep screen awake", "keepAwake", "Hold a wake lock while the mini screen is on", setupWakeLock);
    toggle(gDev, "Haptics", "haptics", "Buzz on taps and new messages");

    /* display */
    const gDis = group("Display");
    slider(gDis, "Brightness", () => s.brightness, v => { s.brightness = v; applyLook(); }, 40, 100, 1);
    const wpRow = document.createElement("div"); wpRow.className = "row";
    wpRow.innerHTML = '<span class="lbl">Wallpaper</span>';
    gDis.appendChild(wpRow);
    const wps = document.createElement("div"); wps.className = "wps";
    WALLPAPERS.forEach(w => {
      const b = document.createElement("button");
      b.style.background = w.css; b.title = w.name;
      b.className = s.wallpaper === w.id ? "sel" : "";
      b.addEventListener("click", () => { s.wallpaper = w.id; save(); applyLook(); renderSettings(); toast(w.name); });
      wps.appendChild(b);
    });
    gDis.appendChild(wps);

    /* camera */
    const gCam = group("Camera");
    toggle(gCam, "Grid lines", "gridLines", "Rule-of-thirds overlay");
    toggle(gCam, "Mirror front lens", "mirrorFront");
    toggle(gCam, "Shutter flash", "shutterFlash");
    const rShots = row(gCam, "Stored shots");
    const shotsVal = document.createElement("span");
    shotsVal.className = "val"; shotsVal.textContent = state.photos.length + " / 12";
    rShots.appendChild(shotsVal);

    /* messenger */
    const gMsg = group("Messenger");
    toggle(gMsg, "Auto-replies", "autoReply", "Contacts answer back");
    const rUn = row(gMsg, "Unread");
    const unVal = document.createElement("span");
    unVal.className = "val"; unVal.textContent = unreadTotal();
    rUn.appendChild(unVal);
    const rClr = row(gMsg, "Clear conversations");
    rClr.classList.add("tap"); rClr.querySelector(".lbl").classList.add("danger");
    rClr.addEventListener("click", () => {
      if(!confirm("Delete every message?")) return;
      state.chats.forEach(c => { c.messages = []; c.unread = 0; });
      save(); renderSettings(); toast("Cleared");
    });

    /* about */
    const gAb = group("About");
    const hero = document.createElement("div");
    hero.className = "hero";
    const W = phone.clientWidth;
    hero.innerHTML = `<div class="m">${esc(s.deviceName)}</div>
      <div class="s">Mini screen · ${Math.round(state.geom.size*W)}×${Math.round(state.geom.size*W)} pt</div>`;
    gAb.appendChild(hero);
    const rSw = row(gAb, "Software");
    const sw = document.createElement("span"); sw.className = "val"; sw.textContent = "MiniOS 1.1";
    rSw.appendChild(sw);
    const rLens = row(gAb, "Rear lens");
    const lensVal = document.createElement("span"); lensVal.className = "val"; lensVal.textContent = stream ? "Live" : "Idle";
    rLens.appendChild(lensVal);
    const rSt = row(gAb, "Storage used");
    const stVal = document.createElement("span"); stVal.className = "val"; stVal.textContent = storageUsed();
    rSt.appendChild(stVal);

    const gRe = group(null);
    const rRe = row(gRe, "Reset Miniphone");
    rRe.classList.add("tap"); rRe.querySelector(".lbl").classList.add("danger");
    rRe.addEventListener("click", () => {
      if(!confirm("Erase settings, shots and messages?")) return;
      localStorage.removeItem(STORE_KEY);
      state = defaultState();
      applyLook(); renderSettings(); updateCam(); toast("Reset");
    });

    const foot = document.createElement("div");
    foot.className = "foot";
    foot.textContent = "Everything stays on this device.";
    body.appendChild(foot);
  }

  function storageUsed(){
    try{
      const bytes = new Blob([localStorage.getItem(STORE_KEY) || ""]).size;
      return bytes > 1048576 ? (bytes/1048576).toFixed(1) + " MB" : Math.max(1, Math.round(bytes/1024)) + " KB";
    }catch(e){ return "—"; }
  }

  /* ============================================================
     Wake lock — a cover screen that sleeps is no cover screen
     ============================================================ */
  let wakeLock = null;
  async function setupWakeLock(){
    if(!("wakeLock" in navigator)) return;
    try{
      if(state.settings.keepAwake && !wakeLock && document.visibilityState === "visible"){
        wakeLock = await navigator.wakeLock.request("screen");
        wakeLock.addEventListener("release", () => { wakeLock = null; });
      }else if(!state.settings.keepAwake && wakeLock){
        await wakeLock.release(); wakeLock = null;
      }
    }catch(e){ /* denied or unsupported — nothing to do */ }
  }
  document.addEventListener("visibilitychange", () => {
    if(document.visibilityState === "visible") setupWakeLock();
    else stopCamera();          // the lens never runs while the page is hidden
  });

  /* ============================================================
     Boot
     ============================================================ */
  applyLook();
  renderHome();
  updateCam();
  tick();
  setupWakeLock();
})();
</script>
</body>
</html>
