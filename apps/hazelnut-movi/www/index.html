<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self'; connect-src 'self'" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hazelnut Movi</title>
  <link rel="stylesheet" href="css/movi.css" />
</head>
<body>
  <div class="app" id="app">

    <header class="bar">
      <div class="brand">
        <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
          <rect x="5" y="15" width="40" height="34" rx="7" fill="none" stroke="currentColor" stroke-width="5"/>
          <path d="M45 30l14-9v22l-14-9z" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round"/>
        </svg>
        <span>Hazelnut <b>Movi</b></span>
      </div>
      <div class="bar__right">
        <button class="pill" id="storage-pill" type="button" title="Your Hazelnut storage"></button>
        <button class="pill pill--credits" id="credits-pill" type="button" title="Credits remaining"></button>
      </div>
    </header>

    <div class="modes" role="tablist" id="modes"></div>

    <main class="work" id="work">

      <!-- Simple -->
      <section class="pane" id="pane-simple">
        <div class="say">
          <label class="say__label" for="prompt-simple">Say what you want.</label>
          <textarea id="prompt-simple" rows="3" placeholder="a cinematic trailer for a mountain film"></textarea>
          <p class="warn" id="simple-warn"></p>
          <div class="quote" id="simple-quote" hidden></div>
          <button class="btn btn--primary btn--big" id="simple-go">Make it</button>
        </div>
        <div class="result" id="simple-result" hidden>
          <div class="result__frame"><canvas id="simple-canvas" width="640" height="360"></canvas></div>
          <p class="result__meta" id="simple-meta"></p>
          <div class="result__actions">
            <button class="btn" id="simple-restore">Put my credits back</button>
            <span class="result__left" id="simple-left"></span>
          </div>
        </div>
      </section>

      <!-- Advanced -->
      <section class="pane" id="pane-advanced" hidden>
        <div class="say say--tight">
          <label class="say__label" for="prompt-advanced">Describe the clip.</label>
          <textarea id="prompt-advanced" rows="2" placeholder="a red kite over a wheat field"></textarea>
          <div class="row">
            <select id="model-advanced" aria-label="Model"></select>
            <button class="btn btn--primary" id="advanced-go"></button>
          </div>
        </div>
        <div class="strip">
          <h2 class="strip__head">Editor <span id="strip-length"></span></h2>
          <ol class="clips" id="clips"></ol>
          <p class="strip__empty" id="strip-empty">No clips yet. Every clip is eight seconds; extend one to make it longer.</p>
        </div>
      </section>
    </main>

    <footer class="status"><span id="status-text"></span></footer>
  </div>

  <div class="sheets" id="sheets"></div>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
