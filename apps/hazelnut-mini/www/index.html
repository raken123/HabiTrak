<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://generativelanguage.googleapis.com" />
  <title>Hazelnut Mini</title>
  <link rel="stylesheet" href="css/mini.css" />
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 2.6c3.9 0 7.2 3 7.2 7 0 4.6-3.1 8.4-7.2 12.4C7.9 18 4.8 14.2 4.8 9.6c0-4 3.3-7 7.2-7Z" fill="currentColor" opacity=".9"/>
          <path d="M12 6.2c2 0 3.6 1.5 3.6 3.5S14 13.2 12 13.2 8.4 11.7 8.4 9.7 10 6.2 12 6.2Z" fill="#1a1a1a"/>
        </svg>
        <span>Hazelnut <b>Mini</b></span>
      </div>
      <button class="chip" id="status-chip" type="button">Free</button>
    </header>

    <main class="chat" id="chat" aria-live="polite"></main>

    <div class="composer">
      <button class="attach" id="attach" type="button" title="Choose a photo" aria-label="Choose a photo">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="8.6" cy="10" r="1.7" fill="currentColor"/><path d="m4 17 5-4.5 3.5 3 3-2.5L20 17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
      </button>
      <input id="composer-input" type="text" autocomplete="off"
             placeholder="Say what to remove — “the bin on the left”" />
      <button class="send" id="send" type="button" aria-label="Send">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12 20 4l-3.4 8L20 20 4 12Z" fill="currentColor"/></svg>
      </button>
    </div>

    <input type="file" id="file-input" accept="image/*" hidden />
  </div>

  <div class="sheet-root" id="sheet-root"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
