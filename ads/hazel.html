<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Hazelnut — Hazel</title>
<link rel="stylesheet" href="hazel.css" />
</head>
<body>
  <div class="film" id="film">

    <div class="sky"></div>
    <div class="sky sky--warm" id="sky-warm"></div>
    <div class="glow" id="glow"></div>
    <div class="flora" id="flora"></div>

    <div class="plate" id="plate">
      <canvas id="drawn" width="470" height="470"></canvas>
      <div class="plate__tag" id="plate-tag"></div>
    </div>

    <div class="stage" id="stage">
      <div class="shadow" id="shadow"></div>
      <img class="hazel" id="hazel" alt="" />
    </div>

    <div class="line line--top" id="line-top"><span id="line-top-text"></span></div>
    <div class="line line--bottom" id="line-bottom"><span id="line-bottom-text"></span></div>

    <div class="end" id="end">
      <img class="end__hazel" id="end-hazel" src="/mascot/hazel.png" alt="" />
      <h1>Hazelnut</h1>
      <p class="end__line">Hazel comes with it.</p>

      <div class="deal" id="deal">
        <div class="deal__head" id="deal-head"></div>
        <div class="deal__price" id="deal-price"></div>
        <div class="deal__meta" id="deal-meta"></div>
      </div>

      <div class="end__plat" id="end-plat">Windows · Mac · Android</div>
    </div>

    <div class="flash" id="flash"></div>
    <div class="vignette"></div>
  </div>
  <script type="module" src="hazel.js"></script>
</body>
</html>
