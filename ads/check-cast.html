<!doctype html>
<html><head><meta charset="utf-8"><title>cast check</title>
<style>
  body { margin:0; background:#0d0c0b; color:#f4efe8; font-family: "Liberation Sans", Arial, sans-serif; }
  .row { display:flex; gap:18px; padding:18px; align-items:flex-start; }
  .p { text-align:center; font-size:15px; }
  canvas { display:block; }
  .print { padding: 0 18px 18px; display:flex; gap:12px; }
  .print canvas { width: 600px; height: 450px; }
</style>
</head><body>
<div class="row" id="row"></div>
<div class="print" id="print"></div>
<script type="module">
  import { portrait, CAST } from './people.js';
  import { printPhoto } from './print-scene.js';
  for (const key of Object.keys(CAST)) {
    const c = portrait({ ...CAST[key].look, size: 300 });
    const d = document.createElement('div');
    d.className = 'p';
    d.append(c, Object.assign(document.createElement('div'), { textContent: CAST[key].name }));
    document.getElementById('row').append(d);
  }
  for (const opts of [{ damage: true }, { damage: false }, { damage: false, colour: true }]) {
    document.getElementById('print').append(printPhoto({ width: 1200, height: 900, ...opts }));
  }
  window.AD = { duration: 1, ready: async () => true, seek: async () => true };
</script>
</body></html>
