<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Hazelnut — the service</title>
<link rel="stylesheet" href="hazel.css" />
<link rel="stylesheet" href="service.css" />
</head>
<body>
  <div class="film" id="film">

    <div class="sky"></div>
    <div class="sky sky--warm" id="sky-warm"></div>
    <div class="glow" id="glow"></div>
    <div class="flora" id="flora"></div>

    <!-- the three products -->
    <div class="cards" id="cards">
      <div class="card" data-card="photo"><div class="card__mark" id="mark-photo"></div>
        <h3 id="name-photo"></h3><p class="card__kind" id="kind-photo"></p></div>
      <div class="card" data-card="movi"><div class="card__mark" id="mark-movi"></div>
        <h3 id="name-movi"></h3><p class="card__kind" id="kind-movi"></p></div>
      <div class="card" data-card="work"><div class="card__mark" id="mark-work"></div>
        <h3 id="name-work"></h3><p class="card__kind" id="kind-work"></p></div>
    </div>

    <!-- one product at a time -->
    <div class="spot" id="spot">
      <div class="spot__mark" id="spot-mark"></div>
      <h2 class="spot__name" id="spot-name"></h2>
      <p class="spot__kind" id="spot-kind"></p>
      <ul class="spot__points" id="spot-points"></ul>
    </div>

    <!-- what happened to Squirreal -->
    <div class="gone" id="gone">
      <div class="gone__strike" id="gone-strike"></div>
      <h2 id="gone-title"></h2>
      <p id="gone-reason"></p>
      <p class="gone__still" id="gone-still"></p>
    </div>

    <!-- the storage offer -->
    <div class="store" id="store">
      <div class="store__size" id="store-size"></div>
      <div class="store__who" id="store-who"></div>
      <div class="store__bar"><span id="store-fill"></span></div>
      <div class="store__after" id="store-after"></div>
    </div>

    <div class="stage" id="stage">
      <div class="shadow" id="shadow"></div>
      <img class="hazel" id="hazel" alt="" />
    </div>

    <div class="line line--top" id="line-top"><span id="line-top-text"></span></div>
    <div class="line line--bottom" id="line-bottom"><span id="line-bottom-text"></span></div>

    <div class="end" id="end">
      <img class="end__hazel" id="end-hazel" src="/mascot/hazel-cheer.png" alt="" />
      <h1 id="end-title"></h1>
      <p class="end__line" id="end-tagline"></p>
      <div class="deal" id="deal">
        <div class="deal__head" id="deal-head"></div>
        <div class="deal__price" id="deal-price"></div>
        <div class="deal__meta" id="deal-meta"></div>
      </div>
      <div class="end__plat" id="end-plat"></div>
    </div>

    <div class="flash" id="flash"></div>
    <div class="vignette"></div>
  </div>
  <script type="module" src="service.js"></script>
</body>
</html>
