<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Hazelnut — The Week Recap</title>
<link rel="stylesheet" href="recap.css" />
</head>
<body>
  <div class="film" id="film">

    <div class="stage" id="stage-hz">
      <iframe id="hz" src="/hazelnut/index.html" width="1920" height="1080" title="Hazelnut"></iframe>
    </div>

    <div class="stage" id="stage-web">
      <iframe id="web" src="/web/index.html" width="1920" height="1080" title="Hazelnut for the Web"></iframe>
    </div>

    <div class="stage stage--device" id="stage-mini">
      <div class="device">
        <iframe id="mini" src="/mini/index.html" width="460" height="900" title="Hazelnut Mini"></iframe>
      </div>
      <div class="device-note" id="device-note">Windows · Mac · Android</div>
    </div>

    <div class="grade" id="grade"></div>

    <div class="scrim" id="scrim"></div>

    <div class="furniture" id="furniture">
      <div class="chip" id="chip">
        <span class="chip__n" id="chip-n">01</span>
        <span class="chip__t" id="chip-t">Fifteen new tools</span>
      </div>

      <div class="third" id="third">
        <div class="third__rule"></div>
        <div class="third__body">
          <div class="third__eyebrow" id="third-eyebrow"></div>
          <h2 class="third__name" id="third-name"></h2>
          <p class="third__line" id="third-line"></p>
          <div class="third__chip" id="third-chip"></div>
        </div>
      </div>
    </div>

    <div class="standin" id="standin">Stand-in — not a model output</div>

    <div class="cast" id="who">
      <div class="cast__portrait" id="who-portrait"></div>
      <div class="cast__body">
        <div class="cast__eyebrow" id="who-eyebrow"></div>
        <h2 class="cast__name" id="who-name"></h2>
        <p class="cast__line" id="who-line"></p>
        <p class="cast__need" id="who-need"></p>
      </div>
    </div>

    <div class="card" id="card">
      <div class="card__inner">
        <img class="mark" id="mark" src="/icons/hazelnut/build/icon.png" alt="" />
        <div class="card__num" id="card-num"></div>
        <h1 class="card__title" id="card-title">The Week Recap</h1>
        <p class="card__sub" id="card-sub"></p>
        <div class="card__grid" id="card-grid"></div>
        <p class="card__foot" id="card-foot"></p>
      </div>
    </div>

    <div class="wipe" id="wipe"></div>
  </div>
  <script type="module" src="recap.js"></script>
</body>
</html>
